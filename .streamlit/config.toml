[server]
# Skip Streamlit's first-run email prompt so the app starts and opens the browser directly.
showEmailPrompt = false

[client]
# Hide the developer toolbar ("Deploy" button) for a clean app look.
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#8b7bff"
backgroundColor = "#0a0e17"
secondaryBackgroundColor = "#151d2e"
textColor = "#e8ecf4"
borderColor = "#1f2a3f"
dataframeHeaderBackgroundColor = "#151d2e"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap, sans-serif"
baseRadius = "0.8rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
