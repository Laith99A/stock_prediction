[server]
# Skip Streamlit's first-run email prompt so the app starts and opens the browser directly.
showEmailPrompt = false

[client]
# Hide the developer toolbar ("Deploy" button) for a clean app look.
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#22c98f"
backgroundColor = "#0c0d0e"
secondaryBackgroundColor = "#17181a"
textColor = "#eef0f1"
borderColor = "#26282b"
dataframeHeaderBackgroundColor = "#17181a"
# "Twemoji Country Flags" only covers flag emoji characters, so Windows shows 🇺🇸 🇩🇪 🇨🇳 as flags, not letters.
font = "Twemoji Country Flags, Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Twemoji Country Flags, Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap, sans-serif"
baseRadius = "0.8rem"
buttonRadius = "0.75rem"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Twemoji Country Flags"
url = "https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1/dist/TwemojiCountryFlags.woff2"
unicodeRange = "U+1F1E6-1F1FF, U+1F3F4, U+E0062-E0063, U+E0065, U+E0067, U+E006C, U+E006E, U+E0073-E0074, U+E0077, U+E007F"

[theme.sidebar]
backgroundColor = "#101112"
