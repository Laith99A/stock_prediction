[server]
# Skip Streamlit's first-run email prompt so the app starts and opens the browser directly.
showEmailPrompt = false

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
headingFontWeights = [800, 750, 700, 700, 600, 600]

[theme.light]
primaryColor = "#1f6feb"
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#e9eef6"
textColor = "#101828"
borderColor = "#dfe5ee"
dataframeHeaderBackgroundColor = "#eef2f8"

[theme.light.sidebar]
backgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#4c8dff"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131d31"
textColor = "#e6ebf5"
borderColor = "#243049"
dataframeHeaderBackgroundColor = "#131d31"

[theme.dark.sidebar]
backgroundColor = "#0f1729"
